-size:11px;font-weight:800}.metric .num{font-size:clamp(20px,3vw,29px);font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.7px;white-space:nowrap}.metric .unit{font-size:10px;color:#9baea7}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;color:#81958e;font-size:12px}.statusbar strong{color:#427b66}.badge{border-radius:9px;padding:5px 9px;background:#f1f6f3;color:#7f948b;font-size:11px;font-weight:800}.badge.active{background:#dff5e9;color:#27916d}.chartwrap{height:240px;position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#fff,#f9fcfa)}canvas.graph{width:100%;height:100%;display:block}.legend{display:flex;gap:15px;flex-wrap:wrap;color:#789087;font-size:11px;margin:10px 0 2px}.legend i{display:inline-block;height:9px;width:9px;border-radius:50%;margin-right:5px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions .btn{flex:1;min-width:95px}.experiment-note{display:flex;gap:10px;padding:13px 14px;background:#fff8ea;color:#9a7545;font-size:12px;border-radius:14px;margin-top:12px}.steps{padding-left:22px;margin:0;color:#688077;font-size:13px}.steps li{padding:0 0 11px 4px}.steps li::marker{color:#3da98a;font-weight:800}.formula{font-size:15px;font-weight:800;padding:13px 16px;background:#ecf7f2;border-radius:14px;color:#32775e;overflow-wrap:anywhere}.info-item{font-size:13px;color:#667e74;margin-bottom:12px}.info-item b{color:#395d50}.empty{padding:50px 20px;text-align:center;color:#82978d;background:#fff;border-radius:24px;border:1px dashed #dce9e2}.empty .big{font-size:54px;display:block;margin-bottom:8px}.record-card{display:flex;gap:12px;align-items:center;padding:16px 18px;margin-bottom:12px;background:#fff;border:1px solid #e6efea;border-radius:17px}.record-card .lab-emoji{width:49px;height:49px;border-radius:15px;flex:none}.record-card .rec-body{flex:1;min-width:0}.record-card h3{margin:0 0 4px;font-size:14px}.record-card p{margin:0;color:#8ea299;font-size:11px}.rec-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:end}.rec-actions button{border:none;background:#eff7f2;color:#387861;border-radius:10px;padding:9px 10px;font-size:12px;font-weight:750}.rec-actions button.delete{background:#fff0ee;color:#b45d57}.filterbar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 19px}.chip{border:none;background:white;color:#82988f;padding:10px 15px;border-radius:99px;font-size:13px;font-weight:800}.chip.sel{background:#298e71;color:#fff}.profile{background:linear-gradient(130deg,#e8f7ef,#ecedff);padding:24px;border-radius:25px;margin-bottom:18px}.profile h1{margin:4px 0 7px}.profile p{margin:0;color:#69817b;font-size:13px}.subtle{color:#96aba0;font-size:12px}.toast{position:fixed;bottom:98px;left:50%;transform:translateX(-50%) translateY(16px);background:#273f38;color:#fff;border-radius:13px;padding:12px 20px;z-index:99;max-width:min(90vw,520px);font-size:13px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px #2b413d30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.bubblezone{height:118px;background:radial-gradient(circle,#e3f6ec,#f8fcfa);border:1px solid #e0f0e8;border-radius:18px;display:grid;place-items:center;margin:13px 0;position:relative;overflow:hidden}.bubbletrack{width:97px;height:97px;border:2px dashed #c0dfcf;border-radius:50%;display:grid;place-items:center}.bubblecenter{width:7px;height:7px;background:#b8d7c7;border-radius:50%;position:absolute}.bubble{width:31px;height:31px;border-radius:50%;background:#5ecaa2;box-shadow:0 4px 15px #55b69a77;border:4px solid #e5fff3;transition:transform .10s}.fine{font-size:11px;color:#8ea399}.dangertext{color:#b76158}.diag{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;border-bottom:1px solid #e8efeb;padding:13px 0}.diag:last-child{border:none}.diag b{color:#397e67}.diag.warn b{color:#c88a48}.diag.bad b{color:#b46a65}.source{font-size:11px;color:#9aaba4;margin-top:23px}.record-detail{display:grid;grid-template-columns:1fr 1fr;gap:11px}.vid{width:100%;max-height:235px;border-radius:15px;background:#e8f1ec;object-fit:cover;transform:scaleX(-1)}@media(min-width:900px){.bottom{left:50%;right:auto;width:460px;transform:translateX(-50%);border:1px solid #e2eae5;border-bottom:none;border-radius:20px 20px 0 0}}@media(max-width:750px){.lab-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lab-layout{grid-template-columns:1fr}.hero{min-height:258px;padding:25px}.hero-art{opacity:.45;right:-85px}.quick{grid-template-columns:1fr}.app{padding:0 16px 120px}.sitehead{padding:16px 0 20px}.panel{padding:17px}.labcard{min-height:174px;padding:16px}.lab-head .lab-emoji{width:67px;height:67px}.lab-head{gap:12px}}@media(max-width:380px){.hero h1{font-size:30px}.hero p{font-size:13px}.labcard h3{font-size:14px}.metric{padding:9px}.metric .num{font-size:20px}.actions .btn{font-size:12px;padding:11px}.logo{font-size:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
'use strict';
const $=s=>document.querySelector(s);
const safeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#4fb99c','#a394e3','#e9a66e'];
const LABS={
 accel:{title:'三軸加速度',icon:'🚀',bg:'#e1f5ed',category:'運動學',type:'motion',desc:'測量 X、Y、Z 三軸加速度（包含重力）',unit:'m/s²',keys:['X 軸','Y 軸','Z 軸'],series:['ax','ay','az'],steps:['將 iPhone 放在桌面上，先觀察靜止時的三軸讀數。','按「開始實驗」，慢慢改變手機方向，再輕輕移動手機。','比較各軸變化，觀察靜止時合加速度約為 9.8 m/s²。'],formula:'|a| = √(ax² + ay² + az²)',tip:'本實驗使用 accelerationIncludingGravity，包含重力造成的加速度；座標軸方向隨手機而定。切勿拋擲手機。'},
 linear:{title:'無重力加速度',icon:'🛼',bg:'#e4edff',category:'運動學',type:'motion',desc:'移除重力後的三軸線性加速度',unit:'m/s²',keys:['X 軸','Y 軸','Z 軸'],series:['ax','ay','az'],steps:['把 iPhone 平穩放在水平桌面，按「開始實驗」。','沿桌面緩慢推動手機，觀察加速度的正負變化。','比較加速、減速與靜止時的曲線。'],formula:'a線性 = a包含重力 − g（由裝置估算）',tip:'依賴瀏覽器提供 acceleration，部分 iPhone 可能不提供；不提供時不會用假數據代替。請避免讓手機滑落桌面。'},
 tilt:{title:'傾角與水平儀',icon:'🫧',bg:'#e7f7e6',category:'力學',type:'orientation',desc:'用手機方向角觀察傾斜和重力方向',unit:'°',keys:['β 前後','γ 左右','α 方位'],series:['beta','gamma','alpha'],steps:['把手機平放，記錄初始前後、左右傾角。','慢慢抬起手機其中一邊，觀察數值和水平泡。','嘗試讓手機保持在水平位置，討論角度和重力分量關係。'],formula:'斜面方向的重力分量：g·sin θ',tip:'β、γ 為裝置姿態角，不一定等於任意斜面的真實坡角；水平泡是示意投影。'},
 gyro:{title:'陀螺儀',icon:'🌀',bg:'#eee8fd',category:'轉動',type:'motion',desc:'三軸角速度，研究轉動方向',unit:'°/s',keys:['α 軸','β 軸','γ 軸'],series:['alpha','beta','gamma'],steps:['將手機握穩，按「開始實驗」。','緩慢沿不同方向旋轉手機，觀察三軸角速度。','試比較相同角度下，快轉與慢轉的曲線峰值。'],formula:'平均角速度 ω̄ = Δθ / Δt',tip:'使用 DeviceMotionEvent.rotationRate，單位為 °/s；數據受硬件、瀏覽器和取樣頻率影響。'},
 pendulum:{title:'單擺週期',icon:'⏱️',bg:'#fff0de',category:'振動',type:'orientation',desc:'輕輕往復傾斜手機，估算振動週期',unit:'°',keys:['左右角 γ','週期 T','擺動次數'],series:['gamma'],steps:['為安全起見，將手機握在手中，不要用繩子懸吊手機。','以穩定節奏輕輕左右傾斜手機（約 ±15° 以上），模擬鐘擺往復。','平台會根據同方向的過零點估算週期；可比較不同節奏。'],formula:'理想單擺：T = 2π√(L/g)',tip:'這是「週期偵測練習」而非真實單擺裝置；人工搖動的週期不能直接用來反推真實擺長。'},
 shake:{title:'振動與碰撞',icon:'〰️',bg:'#fbeaf0',category:'振動',type:'motion',desc:'觀察加速度模長變化和振動峰值',unit:'m/s²',keys:['|a|','偏離 9.81','峰值次數'],series:['mag','delta'],steps:['握住手機並按「開始實驗」。','輕輕搖動手機或有節奏地拍動握著手機的手。','觀察加速度峰值和自動計數結果。'],formula:'振動指標 = ||a| − 9.81|',tip:'這是簡易振動指標，非專業碰撞測量；計數閾值 3 m/s²，峰值間隔至少 350 ms。切勿撞擊或摔下手機。'},
 sound:{title:'聲音強弱',icon:'🎙️',bg:'#e3f3ff',category:'聲學',type:'mic',desc:'利用麥克風觀察相對聲音幅度',unit:'dBFS',keys:['相對音量','RMS','峰值幅度'],series:['db'],steps:['在安靜環境中按「開始實驗」，允許麥克風。','用正常音量說話，觀察波形與相對音量。','改變與手機的距離，比較相對變化。'],formula:'dBFS = 20 log₁₀(RMS)，最大值為 0 dBFS',tip:'dBFS 是數碼音訊相對滿幅值，不是經校準的分貝聲壓級 dB SPL；手機自動增益會影響測量。'},
 pitch:{title:'聲音頻率',icon:'🎵',bg:'#f6e9ff',category:'聲學',type:'mic',desc:'聲音頻譜和主要頻率估計',unit:'Hz',keys:['主峰頻率','音量 dBFS','主峰幅度'],series:['hz'],steps:['在相對安靜的地方啟動麥克風。','哼唱單一音高，或靠近發出穩定音調的音源。','觀察主峰頻率如何隨音高改變。'],formula:'聲音頻率 f = 1 / T',tip:'FFT 找到的是頻譜最大峰，可能是諧波而不是基頻。適合初步聲學觀察，不適合作高精度校音。'},
 light:{title:'相機相對亮度',icon:'🌤️',bg:'#fff1dc',category:'光學',type:'camera',desc:'用相機亮度估計相對光強（非 lux）',unit:'0–255',keys:['平均亮度','相對百分比','最大像素'],series:['brightness'],steps:['按「開始實驗」，允許使用相機。','將手機相機朝向均勻照亮的白紙，確保畫面不過曝。','慢慢改變光源距離，比較相對亮度的趨勢。'],formula:'相對亮度 Y ≈ 0.2126R + 0.7152G + 0.0722B',tip:'自動曝光與白平衡可能改變讀數，並不等同照度計，也不應當作 lux。避免直射太陽或高強度光源。'}
};
const KEY='pocket_lab_records_v1';
let active=null, graphFrame=0, alertTimer=null, lastToastTimer=null, filter='all';
let currPath='';
const now=()=>performance.now();
const fmt=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):'—';
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(lastToastTimer);lastToastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function getRecords(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function setRecords(x){try{localStorage.setItem(KEY,JSON.stringify(x))}catch{toast('本機儲存空間不足，請先匯出 CSV')}}
function card(id){let L=LABS[id];return `<button class="labcard" data-open="${id}"><span class="arrow">↗</span><span class="lab-emoji" style="background:${L.bg}">${L.icon}</span><h3>${L.title}</h3><p>${L.desc}</p><span class="category">${L.category}</span></button>`}
function section(text,desc,right=''){return `<div class="section-title"><div><h2>${text}</h2><p>${desc}</p></div>${right}</div>`}
function renderHome(){let keys=['accel','tilt','pendulum','sound'];return `<section class="hero"><div class="hero-copy"><div class="caps">DISCOVER · MEASURE · LEARN</div><h1>把手機變成<br>你的物理實驗室 ✨</h1><p>利用 iPhone 的真實感測器，即時探索運動、振動、聲音與光。每一次觀察，都是一個新發現。</p><button class="btn primary" data-link="labs">開始探索 <span>↗</span></button></div><div class="hero-art"><div class="orbit"><div class="planet">🔬</div><i class="spark"></i><i class="spark two"></i></div></div></section>${section('精選小實驗','從身邊最簡單的物理現象開始。','<button class="link" data-link="labs">查看全部 →</button>')}<div class="lab-grid">${keys.map(card).join('')}</div>${section('小小實驗提示','測量前的準備功夫同樣重要。')}<div class="quick"><div class="note"><h3>📱 iPhone 使用小貼士</h3><p>用 Safari 開啟 HTTPS 網址，點按開始實驗後，依提示允許動作感測器或麥克風權限。</p></div><div class="note"><h3>💾 你的數據保存在本機</h3><p>停止實驗後可以儲存、檢視和匯出 CSV。數據只保存在這個瀏覽器，不會傳送到任何伺服器。</p></div></div>`}
function renderLabs(){let cat=['全部','運動學','力學','轉動','振動','聲學','光學'];return `${section('探索所有實驗','選一個好奇的現象，動手量度吧！')}<div class="filterbar">${cat.map((s,i)=>`<button class="chip ${filter===(i===0?'all':s)?'sel':''}" data-filter="${i===0?'all':s}">${s}</button>`).join('')}</div><div class="lab-grid">${Object.keys(LABS).filter(id=>filter==='all'||LABS[id].category===filter).map(card).join('')}</div>`}
function renderLab(id){const L=LABS[id];if(!L)return renderLabs();let steps=L.steps.map(x=>`<li>${x}</li>`).join('');let extra=id==='tilt'?`<div class="bubblezone"><div class="bubbletrack"><div class="bubblecenter"></div><div class="bubble" id="bubble"></div></div></div>`:'';let camera=id==='light'?`<video autoplay muted playsinline id="camVideo" class="vid" style="display:none;margin-top:14px"></video>`:'';return `<div class="crumb"><button data-link="labs">← 所有實驗</button><span>/</span><span>${L.category}</span></div><div class="lab-head"><span class="lab-emoji" style="background:${L.bg}">${L.icon}</span><div><div class="caps">POCKET EXPERIMENT</div><h1>${L.title}</h1><p>${L.desc}</p></div></div><div class="lab-layout"><div><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">即時測量</h3><span class="badge" id="labState">● 尚未開始</span></div><div class="statusbar"><span id="statusText">點擊下方「開始實驗」</span><strong id="timer">00:00</strong></div><div class="metric-grid" id="metrics">${L.keys.map((s,i)=>`<div class="metric"><div class="label">${s}</div><div class="num" id="m${i}">—</div><div class="unit">${id==='pendulum'?(i===0?'°':i===1?'s':'次'):id==='shake'&&i===2?'次':id==='pitch'&&i===1?'dBFS':id==='pitch'&&i===2?'dBFS':id==='sound'&&i===1?'ratio':id==='sound'&&i===2?'ratio':id==='light'&&i===1?'%':id==='light'&&i===2?'0–255':L.unit}</div></div>`).join('')}</div>${extra}${camera}<div class="chartwrap"><canvas id="labGraph" class="graph" role="img" aria-label="即時測量曲線"></canvas></div><div class="legend" id="legend">${L.series.map((s,i)=>`<span><i style="background:${COLORS[i]}"></i>${id==='pendulum'?'γ 角度':id==='light'?'亮度':id==='sound'?'dBFS':id==='pitch'?'主峰 Hz':s}</span>`).join('')}</div><div class="actions"><button class="btn primary" id="startBtn" data-action="start">▶ 開始實驗</button><button class="btn outline" id="stopBtn" data-action="stop" disabled>■ 停止並儲存</button><button class="btn outline" id="csvBtn" data-action="export" disabled>⇩ CSV</button></div><div class="experiment-note"><span>💡</span><span id="hintText">${L.tip}</span></div></section></div><div><section class="panel"><h3>📝 實驗步驟</h3><ol class="steps">${steps}</ol><h3 style="margin-top:12px">🔎 相關物理</h3><div class="formula">${L.formula}</div><div class="info-item" style="margin-top:15px">每次點擊「停止並儲存」會在本機保留一筆記錄，方便課堂分析。</div></section><section class="panel" style="margin-top:18px"><h3>🔐 私隱與權限</h3><p class="fine">感測器數據只在裝置內處理。麥克風、相機不會被錄音、錄影上傳；停止實驗即停止使用。需要使用 HTTPS 網址及 Safari 的使用者授權。</p></section></div></div>`}
function renderRecords(){let records=getRecords();return `${section('我的實驗記錄',`共 ${records.length} 筆，儲存於目前的瀏覽器。`,records.length?'<button class="link" data-action="clearrecords">清空記錄</button>':'')}<div>${records.length?records.map(r=>{let L=LABS[r.lab];if(!L)return '';return `<article class="record-card"><span class="lab-emoji" style="background:${L.bg}">${L.icon}</span><div class="rec-body"><h3>${L.title}</h3><p>${safeText(r.date)} · ${r.samples.length} 筆 · ${fmt(r.duration,1)} 秒</p></div><div class="rec-actions"><button data-record="${r.id}" data-action="viewrecord">查看</button><button data-record="${r.id}" data-action="exportrecord">CSV</button><button class="delete" data-record="${r.id}" data-action="deleterecord">刪除</button></div></article>`}).join(''):`<div class="empty"><span class="big">📂</span><b>還沒有實驗記錄</b><p>完成實驗並按「停止並儲存」，這裡就會有你的第一份數據。</p><button class="btn primary" data-link="labs">挑選實驗 →</button></div>`}</div>`}
function renderRecord(id){let r=getRecords().find(x=>x.id===id);if(!r||!LABS[r.lab])return renderRecords();let L=LABS[r.lab];return `<div class="crumb"><button data-link="records">← 我的記錄</button><span>/</span><span>數據明細</span></div><div class="lab-head"><span class="lab-emoji" style="background:${L.bg}">${L.icon}</span><div><div class="caps">SAVED SESSION</div><h1>${L.title}</h1><p>${safeText(r.date)}</p></div></div><div class="panel"><h3>已儲存的曲線</h3><div class="record-detail"><div class="metric"><div class="label">測量時間</div><div class="num">${fmt(r.duration,1)}<small style="font-size:13px"> s</small></div></div><div class="metric"><div class="label">數據筆數</div><div class="num">${r.samples.length}</div></div></div><div class="chartwrap" style="margin-top:18px"><canvas id="recordGraph" class="graph" role="img" aria-label="已儲存測量曲線"></canvas></div><div class="legend">${L.series.map((s,i)=>`<span><i style="background:${COLORS[i]}"></i>${s}</span>`).join('')}</div><div class="actions"><button class="btn primary" data-record="${r.id}" data-action="exportrecord">⇩ 下載 CSV</button><button class="btn outline" data-link="records">返回記錄</button></div><p class="fine" style="margin-top:16px">${L.tip}</p></div>`}
function renderAbout(){const secure=window.isSecureContext;return `<div class="profile"><div class="caps">HELLO, LITTLE SCIENTIST!</div><h1>📚 實驗室使用指南</h1><p>把每一次好奇心，變成可以量度的發現。</p></div><section class="panel"><h3>開始實驗前</h3><ol class="steps"><li>把這份 HTML 部署到 HTTPS 網頁（例如 GitHub Pages、Netlify）。</li><li>在 iPhone 上用 Safari 打開網址。</li><li>按「開始實驗」，在彈出的系統對話框允許感測器、相機或麥克風。</li><li>使用後按「停止並儲存」，到「記錄」頁匯出 CSV 進行分析。</li></ol><div class="experiment-note">💡 <span>只開啟本機 file:// HTML，iPhone 對感測器、相機和麥克風的授權可能失敗；建議 HTTPS。</span></div></section>${section('功能相容性','檢查目前裝置和瀏覽器可以使用哪些 API。')}<section class="panel" id="diagList"><div class="diag"><span>安全環境（HTTPS 或 localhost）</span><b>${secure?'✓ 已符合':'✕ 不符合'}</b></div><div class="diag"><span>動作感測器 API</span><b>${'DeviceMotionEvent' in window?'✓ 有介面（仍需授權）':'✕ 不支援'}</b></div><div class="diag"><span>方向感測器 API</span><b>${'DeviceOrientationEvent' in window?'✓ 有介面（仍需授權）':'✕ 不支援'}</b></div><div class="diag"><span>麥克風 API</span><b>${navigator.mediaDevices?.getUserMedia?'✓ 有介面（仍需授權）':'✕ 不支援'}</b></div><div class="diag"><span>相機 API</span><b>${navigator.mediaDevices?.getUserMedia?'✓ 有介面（仍需授權）':'✕ 不支援'}</b></div><div class="diag warn"><span>磁力計直接讀取</span><b>iOS Safari 一般不支援</b></div><div class="diag warn"><span>環境光 lux 直接讀取</span><b>iOS Safari 一般不支援</b></div><p class="fine">介面存在不代表硬件必然可用，必須按開始測量並成功取得真實數據。</p></section><section class="panel" style="margin-top:18px"><h3>🔬 測量和教學注意</h3><p class="info-item">手機感測器只適合教學及探索，不能代替經校準的實驗儀器。手機通常會自動進行訊號濾波、增益調整或座標變換。</p><p class="info-item">聲音強弱用 dBFS，並非 dB SPL；相機亮度不等於 lux；週期計數只是使用姿態變化的練習。</p><p class="info-item">不需要註冊；資料留在瀏覽器 localStorage，清除瀏覽器資料就會失去記錄，建議定期匯出 CSV。</p></section><div class="source">Pocket Lab · 單檔 HTML · 量測需 HTTPS、適合的裝置及授權</div>`}
function route(){let part=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);let p=part[0]||'home';currPath=p;if(active){if(active.running)stopExperiment(true);stopExperiment(false)}const main=$('#main');if(p==='home')main.innerHTML=renderHome();else if(p==='labs')main.innerHTML=renderLabs();else if(p==='lab')main.innerHTML=renderLab(part[1]);else if(p==='records')main.innerHTML=renderRecords();else if(p==='record')main.innerHTML=renderRecord(part[1]);else main.innerHTML=renderAbout();document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active',el.dataset.nav===(p==='lab'?'labs':p==='record'?'records':p)));window.scrollTo(0,0);if(p==='lab'&&LABS[part[1]]){drawGraph($('#labGraph'),[],LABS[part[1]].series)}if(p==='record'){let r=getRecords().find(x=>x.id===part[1]);if(r&&LABS[r.lab])drawGraph($('#recordGraph'),r.samples,LABS[r.lab].series)}}
function drawGraph(canvas,samples,series){if(!canvas)return;let rect=canvas.getBoundingClientRect(),w=Math.max(180,rect.width),h=Math.max(140,rect.height),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);let ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const m={l:48,r:12,t:17,b:30},iw=w-m.l-m.r,ih=h-m.t-m.b;ctx.clearRect(0,0,w,h);ctx.font='11px -apple-system,Arial';ctx.strokeStyle='#e9f0ed';ctx.fillStyle='#91a59b';ctx.lineWidth=1;const valid=samples.filter(x=>series.some(k=>Number.isFinite(x[k])));let t0=valid[0]?.t??0,t1=valid[valid.length-1]?.t??10;if(t1-t0<2)t1=t0+10;let values=valid.flatMap(row=>series.map(k=>row[k]).filter(Number.isFinite));let min=values.length?Math.min(...values): -1,max=values.length?Math.max(...values):1;if(min===max){min-=1;max+=1}let pad=(max-min)*.16;min-=pad;max+=pad;for(let i=0;i<=4;i++){let y=m.t+i*ih/4;ctx.beginPath();ctx.moveTo(m.l,y);ctx.lineTo(w-m.r,y);ctx.stroke();let v=max-(max-min)*i/4;ctx.fillText(Math.abs(v)>=1000?v.toFixed(0):v.toFixed(1),3,y+4)}for(let i=0;i<=4;i++){let x=m.l+iw*i/4;ctx.beginPath();ctx.moveTo(x,m.t);ctx.lineTo(x,m.t+ih);ctx.stroke();ctx.fillText((t0+(t1-t0)*i/4).toFixed(1)+'s',x-11,h-8)}const xp=t=>m.l+iw*(t-t0)/(t1-t0),yp=v=>m.t+ih*(max-v)/(max-min);series.forEach((k,j)=>{ctx.strokeStyle=COLORS[j];ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();let open=false;for(let row of valid){if(!Number.isFinite(row[k])){open=false;continue}let x=xp(row.t),y=yp(row[k]);if(!open){ctx.moveTo(x,y);open=true}else ctx.lineTo(x,y)}ctx.stroke()});if(!samples.length){ctx.fillStyle='#a5b8ae';ctx.font='13px -apple-system,Arial';ctx.fillText('按「開始實驗」後顯示即時曲線',Math.max(m.l+5,(w-235)/2),h/2)}}
function updateMetric(a){a.forEach((v,i)=>{let el=$('#m'+i);if(el)el.textContent=(v===null||v===undefined||!Number.isFinite(v))?'—':fmt(v,typeof v==='number'&&Math.abs(v)>=100?0:2)})}
function status(msg,badge){let el=$('#statusText');if(el)el.textContent=msg;let b=$('#labState');if(b){b.textContent=badge==='active'?'● 正在測量':badge==='stop'?'● 已停止':'● 等待數據';b.className='badge '+(badge==='active'?'active':'')}}
function startButtons(running){let start=$('#startBtn'),stop=$('#stopBtn'),csv=$('#csvBtn');if(start)start.disabled=running;if(stop)stop.disabled=!running;if(csv)csv.disabled=running||!active?.samples.length}
function sample(data,metrics){if(!active||!active.running)return;const t=(now()-active.t0)/1000;active.got=true;active.lastMetric=metrics||[];if(t-active.lastSampleTime<.045)return;active.lastSampleTime=t;const item={t:Number(t.toFixed(3))};Object.keys(data).forEach(k=>{if(Number.isFinite(data[k]))item[k]=Number(data[k].toFixed(4))});active.samples.push(item);if(active.samples.length>6000)active.samples.shift();updateMetric(metrics||[]);status('持續接收真實感測器數據','active');let timer=$('#timer');if(timer){let n=Math.floor(t);timer.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}if(t-active.lastDraw>.12){active.lastDraw=t;drawGraph($('#labGraph'),active.samples.slice(-270),LABS[active.lab].series)}}
function motionHandler(e){if(!active||!active.running)return;let id=active.lab,rr=e.rotationRate||{};if(id==='gyro'){if([rr.alpha,rr.beta,rr.gamma].every(v=>v==null))return;const a=+rr.alpha,b=+rr.beta,c=+rr.gamma;sample({alpha:a,beta:b,gamma:c},[a,b,c]);return}let a=id==='linear'?e.acceleration:e.accelerationIncludingGravity;if(!a||![a.x,a.y,a.z].some(Number.isFinite))return;let x=Number(a.x)||0,y=Number(a.y)||0,z=Number(a.z)||0;if(id==='shake'){let mag=Math.hypot(x,y,z),delta=Math.abs(mag-9.81);if(delta>3&&now()-active.lastPeak>350){active.peaks++;active.lastPeak=now()}sample({mag,delta},[mag,delta,active.peaks]);return}sample({ax:x,ay:y,az:z},[x,y,z])}
function orientHandler(e){if(!active||!active.running)return;let id=active.lab;let beta=typeof e.beta==='number'?e.beta:null,gamma=typeof e.gamma==='number'?e.gamma:null,alpha=typeof e.alpha==='number'?e.alpha:null;if(beta===null&&gamma===null&&alpha===null)return;if(id==='tilt'){sample({beta,gamma,alpha},[beta,gamma,alpha]);let b=$('#bubble');if(b)b.style.transform=`translate(${Math.max(-35,Math.min(35,(gamma||0)*.65))}px,${Math.max(-35,Math.min(35,(beta||0)*.45))}px)`;return}if(id==='pendulum'){if(gamma===null)return;let t=(now()-active.t0)/1000;let sign=gamma>4?1:gamma< -4?-1:0;if(sign===-1)active.seenNegative=true;if(sign===1&&active.seenNegative&&active.prevSign!==1){if(active.lastCross>0&&t-active.lastCross>.35&&t-active.lastCross<12){active.periods.push(t-active.lastCross);if(active.periods.length>8)active.periods.shift();active.cycle++}active.lastCross=t;active.seenNegative=false}if(sign!==0)active.prevSign=sign;let per=active.periods.length?active.periods.reduce((a,b)=>a+b,0)/active.periods.length:NaN;sample({gamma,period:Number.isFinite(per)?per:null},[gamma,per,active.cycle])}}
async function askMotion(id){const isOrient=LABS[id].type==='orientation';let ctor=isOrient?window.DeviceOrientationEvent:window.DeviceMotionEvent;if(!ctor)throw Error('此瀏覽器未提供相關感測器 API');if(typeof ctor.requestPermission==='function'){const granted=await ctor.requestPermission();if(granted!=='granted')throw Error('未獲授權，請允許使用動作／方向感測器')}if(!active?.running)return;const name=isOrient?'deviceorientation':'devicemotion';const fn=isOrient?orientHandler:motionHandler;window.addEventListener(name,fn);active.clean.push(()=>window.removeEventListener(name,fn))}
function analysisAudio(){let s=active;if(!s||!s.running||!s.analyser)return;let len=s.analyser.fftSize,array=s.audioArray||new Float32Array(len);s.audioArray=array;s.analyser.getFloatTimeDomainData(array);let sq=0,peak=0;for(let i=0;i<len;i++){sq+=array[i]*array[i];peak=Math.max(peak,Math.abs(array[i]))}const rms=Math.sqrt(sq/len),db=Math.max(-100,20*Math.log10(Math.max(rms,1e-5)));if(s.lab==='sound'){sample({db,rms,peak},[db,rms,peak])}else{let bins=s.frequencyArray||new Float32Array(s.analyser.frequencyBinCount);s.frequencyArray=bins;s.analyser.getFloatFrequencyData(bins);let rate=s.audioCtx.sampleRate/len,lo=Math.ceil(80/rate),hi=Math.min(bins.length-2,Math.floor(2000/rate));let best=-Infinity,idx=-1;for(let i=lo;i<=hi;i++)if(bins[i]>best){best=bins[i];idx=i}let hz=null;if(idx>=1&&best>-80&&db>-65){let y1=bins[idx-1],y2=bins[idx],y3=bins[idx+1],den=y1-2*y2+y3;let offset=Math.abs(den)>1e-8?.5*(y1-y3)/den:0;hz=(idx+Math.max(-.5,Math.min(.5,offset)))*rate}sample({hz,db,peakdb:best},[hz,db,Number.isFinite(best)?best:null])}s.audioRAF=requestAnimationFrame(analysisAudio)}
async function askAudio(){if(!navigator.mediaDevices?.getUserMedia)throw Error('瀏覽器無法啟動麥克風；請確認使用 HTTPS');let s=active;let stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});if(!s?.running){stream.getTracks().forEach(x=>x.stop());return}s.clean.push(()=>stream.getTracks().forEach(x=>x.stop()));const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)throw Error('瀏覽器不支援 Web Audio');let ctx=new Ctx();s.audioCtx=ctx;s.clean.push(()=>{ctx.close().catch(()=>{})});let source=ctx.createMediaStreamSource(stream),analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.68;source.connect(analyser);s.analyser=analyser;await ctx.resume();if(s.running)analysisAudio()}
function processCamera(){let s=active;if(!s||!s.running||!s.video||!s.video.videoWidth)return;let ctx=s.offscreen.getContext('2d',{willReadFrequently:true});ctx.drawImage(s.video,0,0,64,48);let bytes=ctx.getImageData(0,0,64,48).data;let sum=0,max=0;for(let i=0;i<bytes.length;i+=4){let Y=.2126*bytes[i]+.7152*bytes[i+1]+.0722*bytes[i+2];sum+=Y;max=Math.max(max,Y)}let avg=sum/(64*48);sample({brightness:avg,max},[avg,avg/255*100,max])}
async function askCamera(){if(!navigator.mediaDevices?.getUserMedia)throw Error('瀏覽器無法啟動相機；請確認使用 HTTPS');let s=active;let stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}});if(!s?.running){stream.getTracks().forEach(x=>x.stop());return}s.clean.push(()=>stream.getTracks().forEach(x=>x.stop()));let v=$('#camVideo');s.video=v;v.srcObject=stream;v.style.display='block';v.play().catch(()=>{});s.offscreen=document.createElement('canvas');s.offscreen.width=64;s.offscreen.height=48;s.cameraInterval=setInterval(processCamera,120);s.clean.push(()=>clearInterval(s.cameraInterval))}
function stopExperiment(save=true){if(!active)return;let s=active;s.running=false;clearTimeout(alertTimer);if(s.audioRAF)cancelAnimationFrame(s.audioRAF);s.clean.forEach(fn=>{try{fn()}catch{}});s.clean=[];if(save&&s.samples.length){const L=LABS[s.lab];const duration=(now()-s.t0)/1000;let trimmed=s.samples;if(trimmed.length>2500){let step=Math.ceil(trimmed.length/2500);trimmed=trimmed.filter((_,i)=>i%step===0)}let records=getRecords();let r={id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),lab:s.lab,date:new Date().toLocaleString('zh-Hant',{hour12:false}),duration,samples:trimmed};records.unshift(r);setRecords(records.slice(0,30));s.saved=r;toast(`已儲存 ${L.title}：${trimmed.length} 筆數據`)}if(save){status(s.samples.length?'測量結束，數據已保留':'已停止（無有效數據）','stop');startButtons(false);let csv=$('#csvBtn');if(csv)csv.disabled=!s.samples.length;let start=$('#startBtn');if(start)start.disabled=false;let stop=$('#stopBtn');if(stop)stop.disabled=true}if(s.video){try{s.video.srcObject=null;s.video.style.display='none'}catch{}}if(!save){active=null} }
async function startExperiment(){let id=location.hash.match(/^#\/lab\/([^/?]+)/)?.[1];if(!LABS[id])return;const L=LABS[id];if(active?.running)return;if(!window.isSecureContext){toast('請先用 HTTPS 網址開啟，才能取得感測器權限');status('需使用 HTTPS 網址','stop');return}if(active){stopExperiment(false)}active={lab:id,running:true,t0:now(),samples:[],clean:[],got:false,lastSampleTime:-1,lastDraw:-1,peaks:0,lastPeak:0,seenNegative:false,prevSign:0,lastCross:-1,cycle:0,periods:[]};const s=active;updateMetric([null,null,null]);startButtons(true);status('正在向手機請求授權…','wait');drawGraph($('#labGraph'),[],L.series);alertTimer=setTimeout(()=>{if(active===s&&s.running&&!s.got){status('尚未收到數據，請確認 Safari 權限及裝置支援','wait');toast('如一直沒有數據，可前往「指南」查看相容性')}},5000);try{if(L.type==='motion'||L.type==='orientation')await askMotion(id);else if(L.type==='mic')await askAudio();else if(L.type==='camera')await askCamera();if(active===s&&s.running)status('已啟動，等待第一筆數據…','wait')}catch(err){if(active===s){status(err.message||'無法啟動，請檢查權限','stop');toast(err.message||'無法啟動');stopExperiment(false);let st=$('#startBtn'),sp=$('#stopBtn');if(st)st.disabled=false;if(sp)sp.disabled=true}}}
function quoteCSV(v){if(v==null||!Number.isFinite(v))return '';return String(v)}
function exportCSV(r){if(!r||!LABS[r.lab])return;let keys=['t',...new Set(r.samples.flatMap(x=>Object.keys(x).filter(k=>k!=='t')))];let csv='\ufeff'+keys.join(',')+'\r\n'+r.samples.map(x=>keys.map(k=>quoteCSV(x[k])).join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`PocketLab_${r.lab}_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('已準備 CSV 檔案，請在手機選擇儲存或分享')}
function exportActive(){if(!active?.samples?.length){toast('暫無數據可匯出');return}exportCSV({lab:active.lab,samples:active.samples})}
window.addEventListener('hashchange',route);window.addEventListener('pagehide',()=>{if(active?.running)stopExperiment(true)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active?.running){stopExperiment(true);toast('畫面已切換，測量已停止及儲存')}});
document.addEventListener('click',e=>{let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.nav){location.hash=btn.dataset.nav==='home'?'#/':'#/'+btn.dataset.nav;return}if(btn.dataset.link){location.hash=btn.dataset.link==='home'?'#/':'#/'+btn.dataset.link;return}if(btn.dataset.open){location.hash='#/lab/'+btn.dataset.open;return}if(btn.dataset.filter){filter=btn.dataset.filter;route();return}let id=btn.dataset.record,action=btn.dataset.action;if(!action)return;if(action==='start')startExperiment();if(action==='stop')stopExperiment(true);if(action==='export')exportActive();if(action==='viewrecord')location.hash='#/record/'+id;if(action==='exportrecord'){let r=getRecords().find(x=>x.id===id);if(r)exportCSV(r)}if(action==='deleterecord'){if(confirm('刪除此筆實驗記錄？')){setRecords(getRecords().filter(x=>x.id!==id));route();toast('已刪除記錄')}}if(action==='clearrecords'){if(confirm('確定要清空所有實驗記錄？這無法復原。')){setRecords([]);route();toast('記錄已清空')}}});
window.addEventListener('resize',()=>{let r=location.hash.match(/^#\/record\/([^/?]+)/);if(r){let obj=getRecords().find(x=>x.id===r[1]);if(obj)drawGraph($('#recordGraph'),obj.samples,LABS[obj.lab].series)}else if(active&&location.hash.includes('#/lab/'))drawGraph($('#labGraph'),active.samples.slice(-270),LABS[active.lab].series)});
route();
</script>
