<div class="app"><header class="sitehead"><a href="#/" class="logo" aria-label="返回首頁"><span class="logoicon">🧪</span><span>小小物理室 <span style="color:#9aadab;font-size:11px;font-weight:600">Pocket Lab</span></span></a><button class="header-help" data-link="about" aria-label="幫助">?</button></header><main id="main" aria-live="polite"></main></div>
<nav class="bottom" id="nav" aria-label="主要導覽"><button class="navitem" data-nav="home"><span class="navico">⌂</span>實驗</button><button class="navitem" data-nav="lan"><span class="navico">⌁</span>連線</button><button class="navitem" data-nav="records"><span class="navico">▤</span>記錄</button></nav>
<div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const safeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#4fb99c','#a394e3','#e9a66e'];
const LABS={
 accel:{title:'三軸加速度',icon:'🚀',bg:'#e1f5ed',category:'運動學',type:'motion',desc:'測量 X、Y、Z 三軸加速度（包含重力）',unit:'m/s²',keys:['X 軸','Y 軸','Z 軸'],series:['ax','ay','az'],steps:['將 iPhone 放在桌面上，先觀察靜止時的三軸讀數。','按「開始實驗」，慢慢改變手機方向，再輕輕移動手機。','比較各軸變化，觀察靜止時合加速度約為 9.8 m/s²。'],formula:'|a| = √(ax² + ay² + az²)',tip:'本實驗使用 accelerationIncludingGravity，包含重力造成的加速度；座標軸方向隨手機而定。切勿拋擲手機。'},
 linear:{title:'無重力加速度',icon:'🛼',bg:'#e4edff',category:'運動學',type:'motion',desc:'移除重力後的三軸線性加速度',unit:'m/s²',keys:['X 軸','Y 軸','Z 軸'],series:['ax','ay','az'],steps:['把 iPhone 平穩放在水平桌面，按「開始實驗」。','沿桌面緩慢推動手機，觀察加速度的正負變化。','比較加速、減速與靜止時的曲線。'],formula:'a線性 = a包含重力 − g（由裝置估算）',tip:'依賴瀏覽器提供 acceleration，部分 iPhone 可能不提供；不提供時不會用假數據代替。請避免讓手機滑落桌面。'},
 tilt:{title:'傾角與水平儀',icon:'🫧',bg:'#e7f7e6',category:'力學',type:'orientation',desc:'用手機方向角觀察傾斜和重力方向',unit:'°',keys:['β 前後','γ 左右','α 方位'],series:['beta','gamma','alpha'],steps:['把手機平放，記錄初始前後、左右傾角。','慢慢抬起手機其中一邊，觀察數值和水平泡。','嘗試讓手機保持在水平位置，討論角度和重力分量關係。'],formula:'斜面方向的重力分量：g·sin θ',tip:'β、γ 為裝置姿態角，不一定等於任意斜面的真實坡角；水平泡是示意投影。'},
 gyro:{title:'陀螺儀',icon:'🌀',bg:'#eee8fd',category:'轉動',type:'motion',desc:'三軸角速度，研究轉動方向',unit:'°/s',keys:['α 軸','β 軸','γ 軸'],series:['alpha','beta','gamma'],steps:['將手機握穩，按「開始實驗」。','緩慢沿不同方向旋轉手機，觀察三軸角速度。','試比較相同角度下，快轉與慢轉的曲線峰值。'],formula:'平均角速度 ω̄ = Δθ / Δt',tip:'使用 DeviceMotionEvent.rotationRate，單位為 °/s；數據受硬件、瀏覽器和取樣頻率影響。'},
 pendulum:{title:'單擺週期',icon:'⏱️',bg:'#fff0de',category:'振動',type:'orientation',desc:'輕輕往復傾斜手機，估算振動週期',unit:'°',keys:['左右角 γ','週期 T','擺動次數'],series:['gamma'],steps:['為安全起見，將手機握在手中，不要用繩子懸吊手機。','以穩定節奏輕輕左右傾斜手機（約 ±15° 以上），模擬鐘擺往復。','平台會根據同方向的過零點估算週期；可比較不同節奏。'],formula:'理想單擺：T = 2π√(L/g)',tip:'這是「週期偵測練習」而非真實單擺裝置；人工搖動的週期不能直接用來反推真實擺長。'},
 shake:{title:'振動與碰撞',icon:'〰️',bg:'#fbeaf0',category:'振動',type:'motion',desc:'觀察加速度模長變化和振動峰值',unit:'m/s²',keys:['|a|','偏離 9.81','峰值次數'],series:['mag','delta'],steps:['握住手機並按「開始實驗」。','輕輕搖動手機或有節奏地拍動握著手機的手。','觀察加速度峰值和自動計數結果。'],formula:'振動指標 = ||a| − 9.81|',tip:'這是簡易振動指標，非專業碰撞測量；計數閾值 3 m/s²，峰值間隔至少 350 ms。切勿撞擊或摔下手機。'},
 sound:{title:'聲音強弱',icon:'🎙️',bg:'#e3f3ff',category:'聲學',type:'mic',desc:'利用麥克風觀察相對聲音幅度',unit:'dBFS',keys:['相對音量','RMS','峰值幅度'],series:['db'],steps:['在安靜環境中按「開始實驗」，允許麥克風。','用正常音量說話，觀察波形與相對音量。','改變與手機的距離，比較相對變化。'],formula:'dBFS = 20 log₁₀(RMS)，最大值為 0 dBFS',tip:'dBFS 是數碼音訊相對滿幅值，不是經校準的分貝聲壓級 dB SPL；手機自動增益會影響測量。'},
 pitch:{title:'聲音頻率',icon:'🎵',bg:'#f6e9ff',category:'聲學',type:'mic',desc:'聲音頻譜和主要頻率估計',unit:'Hz',keys:['主峰頻率','音量 dBFS','主峰幅度'],series:['hz'],steps:['在相對安靜的地方啟動麥克風。','哼唱單一音高，或靠近發出穩定音調的音源。','觀察主峰頻率如何隨音高改變。'],formula:'聲音頻率 f = 1 / T',tip:'FFT 找到的是頻譜最大峰，可能是諧波而不是基頻。適合初步聲學觀察，不適合作高精度校音。'},
 gps:{title:'GPS 移動速度',icon:'🛰️',bg:'#e3f2ff',category:'位置與方向',type:'geo',desc:'利用定位功能量度移動速度及座標',unit:'km/h',keys:['速度','定位誤差','航向角'],series:['speed'],steps:['在戶外安全、開闊的位置，開啟 GPS 並允許定位權限。','手持手機步行，等待定位逐漸穩定（通常需要一些時間）。','觀察速度與定位誤差變化，勿在駕車或過馬路時操作手機。'],formula:'v = Δs / Δt（定位模組提供估算值）',tip:'速度源於 GPS/定位 API，單位已由 m/s 轉為 km/h；裝置可能回傳空值，室內會有較大誤差。位置座標只在你主動啟用局域網分享時向已配對的電腦傳送。'},
 altitude:{title:'GPS 高度',icon:'⛰️',bg:'#e6f4f0',category:'位置與方向',type:'geo',desc:'衛星定位提供的高度及精度（視裝置而定）',unit:'m',keys:['海拔高度','高度誤差','水平誤差'],series:['altitude'],steps:['開啟 GPS 高度並允許定位。','在開闊區域觀察高度數值，確認是否顯示真實資料。','將量度和所在地圖高度比較，討論衛星定位的誤差。'],formula:'Δh = h₂ − h₁',tip:'iPhone Safari 可能不提供 altitude / altitudeAccuracy；沒有數據會顯示「—」，不會用假高度填補。GPS 高度不等於氣壓高度。'},
 compass:{title:'電子羅盤',icon:'🧭',bg:'#fff0e0',category:'位置與方向',type:'orientation',desc:'查看手機指向的方位角（支援時）',unit:'°',keys:['羅盤方向','姿態 α','前後傾角'],series:['heading'],steps:['在沒有大型金屬物件的地方開啟羅盤。','保持手機大致水平，緩慢轉動手機，觀察角度。','比較不同方向，討論磁北、真北和感測器校正。'],formula:'方位角 θ：北 0°，東 90°，南 180°，西 270°',tip:'優先使用 iOS 的 webkitCompassHeading；若瀏覽器只提供非絕對 α 而無羅盤方向，則不會冒充真實指南針。此模式不提供磁力計的 μT 磁場數值。'},
 steps:{title:'步行節奏與計步',icon:'👟',bg:'#ffebf1',category:'運動學',type:'motion',desc:'使用加速度峰值估算步數與步頻',unit:'次',keys:['估算步數','步頻','動態加速度'],series:['stepCount','dyn'],steps:['將手機穩定握在手上或放在衣袋中，啟動實驗。','以正常速度步行至少 15 秒，讓演算法偵測步伐。','將偵測結果與人工計數比較，分析取樣率和偵測門檻的影響。'],formula:'步頻（步/分鐘）= 60 × (步數增量 / 時間)',tip:'這是基於加速度局部峰值的簡化計步演算法，不等同系統健康 App 的步數；不同擺放方式會影響準確率。'},
 light:{title:'相機相對亮度',icon:'🌤️',bg:'#fff1dc',category:'光學',type:'camera',desc:'用相機亮度估計相對光強（非 lux）',unit:'0–255',keys:['平均亮度','相對百分比','最大像素'],series:['brightness'],steps:['按「開始實驗」，允許使用相機。','將手機相機朝向均勻照亮的白紙，確保畫面不過曝。','慢慢改變光源距離，比較相對亮度的趨勢。'],formula:'相對亮度 Y ≈ 0.2126R + 0.7152G + 0.0722B',tip:'自動曝光與白平衡可能改變讀數，並不等同照度計，也不應當作 lux。避免直射太陽或高強度光源。'}
};
const KEY='pocket_lab_records_v1';
let active=null, graphFrame=0, alertTimer=null, lastToastTimer=null, filter='all';
let currPath='';
const now=()=>performance.now();
const fmt=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):'—';
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(lastToastTimer);lastToastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function getRecords(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function setRecords(x){try{localStorage.setItem(KEY,JSON.stringify(x))}catch{toast('本機儲存空間不足，請先匯出 CSV')}}
function card(id){const L=LABS[id];return `<button class="labcard" data-open="${id}" aria-label="開啟${L.title}"><span class="lab-emoji" style="background:${L.bg}">${L.icon}</span><h3>${L.title}</h3><span class="mini-arrow">↗</span></button>`}
function section(text,desc,right=''){return `<div class="section-title"><div><h2>${text}</h2><p>${desc}</p></div>${right}</div>`}
const lan={ws:null,role:null,code:'',viewers:0,lab:null,samples:[],remoteTitle:'',state:'尚未連接',lastSend:0};
const lanMode=()=>/^https?:$/.test(location.protocol);
function lanStatus(msg){lan.state=msg;let e=$('#lanState');if(e)e.textContent=msg}
function lanSend(message){if(lan.ws?.readyState===WebSocket.OPEN)lan.ws.send(JSON.stringify(message))}
function closeLan(){const ws=lan.ws;lan.ws=null;lan.role=null;lan.code='';lan.viewers=0;if(ws)ws.close(1000,'已離線');lanStatus('已斷線');if(currPath==='lan')updateLanUI()}
async function openLan(role,code){if(lan.ws?.readyState===WebSocket.OPEN){closeLan()}const response=await fetch('/api/info',{cache:'no-store'}).catch(()=>null);
if(!response?.ok)throw Error('請透過電腦執行 server.py，然後開啟局域網 HTTPS 網址。');
const info=await response.json();if(!info.pocketlab)throw Error('此網址不是 Pocket Lab 局域網伺服器');
return new Promise((resolve,reject)=>{const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';const ws=new WebSocket(url);
let settled=false;const timeout=setTimeout(()=>{if(!settled){settled=true;ws.close();reject(Error('連線逾時，請檢查 Wi‑Fi 與電腦防火牆'))}},8500);
ws.onopen=()=>{ws.send(JSON.stringify(role==='source'?{type:'create'}:{type:'join',code}))};
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
if(m.type==='created'||m.type==='joined'){if(!settled){settled=true;clearTimeout(timeout);lan.ws=ws;lan.role=role;lan.code=m.code;lan.lab=null;lan.samples=[];lanStatus(role==='source'?'手機已連線，等待電腦加入':'已配對，等待手機開始實驗');resolve(m)}if(m.last?.type==='sample')receiveSample(m.last);updateLanUI()}
else if(m.type==='viewers'){lan.viewers=m.count;updateLanUI()}
else if(m.type==='sample'){receiveSample(m)}
else if(m.type==='stopped'){lanStatus('手機已停止量測，最後數據仍可匯出')}
else if(m.type==='source_left'){lanStatus('手機已離線');toast('手機已離線')}
else if(m.type==='error'){if(!settled){settled=true;clearTimeout(timeout);reject(Error(m.message||'連線錯誤'));ws.close()}else lanStatus(m.message)}
};
ws.onerror=()=>{if(!settled){settled=true;clearTimeout(timeout);reject(Error('WebSocket 連線失敗，請檢查 HTTPS 憑證'))}};
ws.onclose=()=>{if(!settled){settled=true;clearTimeout(timeout);reject(Error('連線遭到關閉'))}if(lan.ws===ws){lan.ws=null;lan.role=null;lanStatus('連線已關閉');updateLanUI()}};
})}
function liveSendSample(lab,item){if(lan.role!=='source'||lan.ws?.readyState!==WebSocket.OPEN)return;let t=now();if(t-lan.lastSend<100)return;lan.lastSend=t;lanSend({type:'sample',lab,data:item})}
function receiveSample(msg){if(lan.role!=='viewer')return;const L=LABS[msg.lab];if(!L)return;if(lan.lab!==msg.lab){lan.lab=msg.lab;lan.samples=[]}
const item=msg.data;if(!item||typeof item!=='object')return;lan.samples.push(item);if(lan.samples.length>5000)lan.samples.shift();
lanStatus('● 正在接收 '+L.title+' 的真實數據');if(currPath==='lan')updateLivePanel()}
function renderLan(){return `
<div class="page-intro"><div class="caps">LIVE · LAN</div><h1>📡 連接電腦</h1><p>同一個 Wi-Fi，即時同步數據</p></div>
<div class="connect-grid">
  <section class="panel connect-card"><div class="connect-title"><span class="connect-ico" style="background:#e2f7ee">📱</span><div><h3>手機發送</h3><p>分享即時量測</p></div></div>
    <button class="btn primary full" data-action="lancreate">產生連線碼</button>
    <div id="lanCode" class="code-display">${lan.role==='source'?safeText(lan.code):'— — — — — —'}</div>
    <div class="lan-status" id="lanCount">${lan.role==='source'?lan.viewers+' 部裝置已連線':''}</div>
  </section>
  <section class="panel connect-card"><div class="connect-title"><span class="connect-ico" style="background:#e8efff">💻</span><div><h3>電腦觀看</h3><p>輸入手機連線碼</p></div></div>
    <input class="lan-input" id="joinCode" type="text" maxlength="6" placeholder="連線碼" autocomplete="off" autocapitalize="characters" aria-label="六位連線碼">
    <button class="btn primary full" data-action="lanjoin">連接手機 ↗</button>
    <div class="lan-status" id="lanJoinDetails">${lan.role==='viewer'?'已配對 · '+safeText(lan.code):' '}</div>
  </section>
</div>
<section class="panel remote-panel"><div class="panel-top"><h3>即時畫面</h3><span class="badge" id="lanLiveBadge">${lan.role==='viewer'?'等待測量':'未連接'}</span></div>
  <div class="lan-status" id="lanState">${safeText(lan.state)}</div>
  <div id="lanLiveBody"><div class="empty-slim"><span>〰</span><p>連線後顯示即時曲線</p></div></div>
  <div class="actions"><button class="btn outline" data-action="lanexport" id="lanExportBtn" ${lan.samples.length?'':'disabled'}>↓ CSV</button><button class="btn outline" data-action="landisconnect" ${lan.role?'':'disabled'}>中斷連線</button></div>
</section>
<details class="fold"><summary>第一次連線？<span>設定方法</span></summary><div class="fold-body"><ol class="steps"><li>Windows 電腦開啟「啟動伺服器_Windows.bat」。</li><li>手機和電腦連接同一 Wi-Fi，開啟伺服器顯示的網址。</li><li>手機按「產生連線碼」，電腦輸入後按「連接手機」。</li><li>手機返回「實驗」開始量測。</li></ol><p>iPhone 首次使用本機 HTTPS，須先設定自己的憑證：Safari 開啟 <code>http://電腦IP:8765</code> 並按頁面說明操作。僅可在信任的私人裝置安裝自建根憑證；一般學生不應隨意安裝。</p><p>配對後會傳送感測器數值，GPS 實驗亦可能包含經緯度。音訊和相機原始畫面不會傳送。</p></div></details>
`}
function updateLanUI(){if(currPath!=='lan')return;let code=$('#lanCode');if(code)code.textContent=lan.role==='source'?lan.code:'— — — — — —';let count=$('#lanCount');if(count)count.textContent=lan.role==='source'?lan.viewers+' 部電腦觀看中':'';let d=$('#lanJoinDetails');if(d)d.textContent=lan.role==='viewer'?'配對成功 · '+lan.code:'等待輸入連線碼';let st=$('#lanState');if(st)st.textContent=lan.state;let ex=$('#lanExportBtn');if(ex)ex.disabled=!lan.samples.length;updateLivePanel()}
function updateLivePanel(){if(currPath!=='lan')return;let node=$('#lanLiveBody');if(!node)return;const L=LABS[lan.lab];let b=$('#lanLiveBadge');if(b)b.textContent=L?.title||'等待量測';if(!L||lan.role!=='viewer')return;
const last=lan.samples[lan.samples.length-1]||{};const units=L.keys.map((k,i)=>labUnit(lan.lab,i));let html=`<div class="live-metrics">${L.keys.map((title,i)=>`<div class="metric"><div class="label">${title}</div><div class="live-big">${fmt(last[LIVE_KEYS[lan.lab]?.[i] || L.series[i]],2)}</div><div class="unit">${units[i]}</div></div>`).join('')}</div><div class="chartwrap"><canvas id="remoteGraph" class="graph" role="img" aria-label="電腦即時曲線"></canvas></div><div class="legend">${L.series.map((k,i)=>`<span><i style="background:${COLORS[i]}"></i>${k}</span>`).join('')}</div><p class="fine">已收到 ${lan.samples.length} 筆 · 量測以手機傳送的樣本時間 t 為橫軸。</p>`;
// Reuse the canvas for efficient updates instead of recreating the chart each sample.
if(!$('#remoteGraph'))node.innerHTML=html;else{let items=node.querySelectorAll('.live-big');L.keys.forEach((_,i)=>{if(items[i])items[i].textContent=fmt(last[LIVE_KEYS[lan.lab]?.[i]||L.series[i]],2)});let p=node.querySelector('p.fine');if(p)p.textContent=`已收到 ${lan.samples.length} 筆 · 數據保存在電腦瀏覽器的記憶體。`}
drawGraph($('#remoteGraph'),lan.samples.slice(-250),L.series);let ex=$('#lanExportBtn');if(ex)ex.disabled=!lan.samples.length}
const LIVE_KEYS={gps:['speed','accuracy','heading'],altitude:['altitude','altitudeAccuracy','accuracy'],compass:['heading','alpha','beta'],steps:['stepCount','cadence','dyn'],pendulum:['gamma','period','cycle'],shake:['mag','delta','peaks'],light:['brightness','percent','max'],sound:['db','rms','peak'],pitch:['hz','db','peakdb']};
function labUnit(id,i){if(id==='gps')return ['km/h','m','°'][i];if(id==='altitude')return 'm';if(id==='compass')return '°';if(id==='steps')return ['次','步/分鐘','m/s²'][i];if(id==='light')return ['0–255','%','0–255'][i];if(id==='pendulum')return ['°','s','次'][i];if(id==='shake')return ['m/s²','m/s²','次'][i];if(id==='pitch')return ['Hz','dBFS','dBFS'][i];if(id==='sound')return ['dBFS','ratio','ratio'][i];return LABS[id]?.unit||''}
function renderHome(){const keys=Object.keys(LABS);return `
<section class="fresh-hero"><div><div class="caps">POCKET LAB</div><h1>今天想量甚麼？</h1><p>選一個實驗，按開始就可以 ✨</p></div><div class="hero-sticker" aria-hidden="true">🔬</div></section>
<button class="connect-strip" data-link="lan"><span class="strip-icon">📡</span><span><b>連接電腦</b><small>手機測量 · 電腦即時看</small></span><span class="strip-go">↗</span></button>
<div class="simple-section-title"><h2>探索實驗</h2><span>${keys.length} 個</span></div>
<div class="lab-grid">${keys.map(card).join('')}</div>
`}
function renderLabs(){return renderHome()}

function exportActive(){if(!active?.samples?.length){toast('暫無數據可匯出');return}exportCSV({lab:active.lab,samples:active.samples})}
window.addEventListener('hashchange',route);window.addEventListener('pagehide',()=>{if(active?.running)stopExperiment(true)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active?.running){stopExperiment(true);toast('畫面已切換，測量已停止及儲存')}});
document.addEventListener('click',e=>{let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.nav){location.hash=btn.dataset.nav==='home'?'#/':'#/'+btn.dataset.nav;return}if(btn.dataset.link){location.hash=btn.dataset.link==='home'?'#/':'#/'+btn.dataset.link;return}if(btn.dataset.open){location.hash='#/lab/'+btn.dataset.open;return}if(btn.dataset.filter){filter=btn.dataset.filter;route();return}let id=btn.dataset.record,action=btn.dataset.action;if(!action)return;if(action==='lancreate'){lanStatus('正在連接本機伺服器…');openLan('source').then(()=>toast('手機分享已開啟，請進入實驗頁')).catch(err=>{lanStatus(err.message);toast(err.message)});return}if(action==='lanjoin'){const value=($('#joinCode')?.value||'').trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(value)){toast('請輸入手機顯示的 6 位連線碼');return}lanStatus('正在配對…');openLan('viewer',value).catch(err=>{lanStatus(err.message);toast(err.message)});return}if(action==='landisconnect'){closeLan();return}if(action==='lanexport'){exportLan();return}if(action==='start')startExperiment();if(action==='stop')stopExperiment(true);if(action==='export')exportActive();if(action==='viewrecord')location.hash='#/record/'+id;if(action==='exportrecord'){let r=getRecords().find(x=>x.id===id);if(r)exportCSV(r)}if(action==='deleterecord'){if(confirm('刪除此筆實驗記錄？')){setRecords(getRecords().filter(x=>x.id!==id));route();toast('已刪除記錄')}}if(action==='clearrecords'){if(confirm('確定要清空所有實驗記錄？這無法復原。')){setRecords([]);route();toast('記錄已清空')}}});
window.addEventListener('resize',()=>{let r=location.hash.match(/^#\/record\/([^/?]+)/);if(r){let obj=getRecords().find(x=>x.id===r[1]);if(obj)drawGraph($('#recordGraph'),obj.samples,LABS[obj.lab].series)}else if(active&&location.hash.includes('#/lab/'))drawGraph($('#labGraph'),active.samples.slice(-270),LABS[active.lab].series)});
route();
</script>
</body>
</html>
